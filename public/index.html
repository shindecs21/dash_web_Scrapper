<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morning Brief — Dashboard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        line-height: 1.4;
      }
      body {
        margin: 0;
        background: #f6f7fb;
        color: #1b1f24;
      }
      header {
        background: #fff;
        border-bottom: 1px solid #e5e8ef;
        padding: 16px 20px;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      .meta {
        color: #5b6472;
        font-size: 14px;
        margin-top: 4px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .tab {
        border: 1px solid #e5e8ef;
        background: #fafbfd;
        color: #1b1f24;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
      }
      .tab.active {
        background: #2457d6;
        border-color: #2457d6;
        color: #fff;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
      }
      .panel {
        background: #fff;
        border: 1px solid #e5e8ef;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .panel-title {
        padding: 12px 16px;
        font-weight: 600;
        border-bottom: 1px solid #eef1f6;
        background: #fafbfd;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid #eef1f6;
        text-align: left;
        vertical-align: middle;
      }
      th {
        background: #fafbfd;
        font-weight: 600;
      }
      th.expand-col,
      td.expand-col {
        width: 40px;
        text-align: center;
        padding-left: 8px;
        padding-right: 8px;
      }
      .index-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        padding: 16px;
      }
      .index-card {
        border: 1px solid #eef1f6;
        border-radius: 10px;
        padding: 14px;
        background: #fafbfd;
      }
      .index-card .label {
        font-size: 13px;
        color: #5b6472;
        margin-bottom: 6px;
      }
      .index-card .price {
        font-size: 22px;
        font-weight: 700;
      }
      .index-card .change {
        font-size: 14px;
        margin-top: 4px;
        font-weight: 600;
      }
      .up { color: #0d7a43; }
      .down { color: #b42318; }
      .flat { color: #5b6472; }
      .store-name { font-weight: 700; }
      .store-name a {
        color: inherit;
        text-decoration: none;
      }
      .store-name a:hover { color: #2457d6; }
      .store-rank {
        color: #5b6472;
        font-weight: 500;
        margin-right: 6px;
      }
      td a.value-link {
        color: #2457d6;
        text-decoration: none;
      }
      td a.value-link:hover { text-decoration: underline; }
      tr.store-row { background: #fff; }
      tr.store-row:hover { background: #fafbfd; }
      tr.detail-row {
        background: #f8f9fc;
        display: none;
      }
      tr.detail-row.open { display: table-row; }
      tr.detail-row td:first-child {
        padding-left: 28px;
        color: #5b6472;
        font-size: 13px;
      }
      .expand-btn {
        border: none;
        background: transparent;
        cursor: pointer;
        color: #5b6472;
        font-size: 12px;
        padding: 4px;
        border-radius: 4px;
      }
      .expand-btn:hover {
        background: #eef1f6;
        color: #1b1f24;
      }
      .expand-btn:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .empty-note {
        color: #5b6472;
        font-style: italic;
      }
      .hidden { display: none; }
      .num { font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <header>
      <h1>Morning Brief</h1>
      <div class="meta" id="meta">Loading…</div>
      <nav class="tabs" id="tabs">
        <button type="button" class="tab active" data-tab="deals">Gift Cards</button>
        <button type="button" class="tab" data-tab="markets">Markets</button>
      </nav>
    </header>
    <main>
      <div id="deals-panel"></div>
      <div id="markets-panel" class="hidden"></div>
    </main>
    <script>
      const meta = document.getElementById('meta');
      const dealsPanel = document.getElementById('deals-panel');
      const marketsPanel = document.getElementById('markets-panel');
      const tabs = document.getElementById('tabs');

      let zingoyData = null;
      let marketsData = null;
      let activeTab = 'deals';

      function fmtMoney(n, currency = 'INR') {
        if (n == null) return '—';
        if (currency === 'INR') return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
        return Number(n).toLocaleString(undefined, { maximumFractionDigits: 4 });
      }

      function fmtChange(n, pct) {
        if (n == null && pct == null) return '—';
        const sign = n > 0 ? '+' : '';
        const cls = n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
        const abs = n == null ? '' : `${sign}${Number(n).toFixed(2)}`;
        const p = pct == null ? '' : ` (${sign}${Number(pct).toFixed(2)}%)`;
        return `<span class="${cls} num">${abs}${p}</span>`;
      }

      function renderVoucherCell(voucher, productUrl) {
        if (!voucher?.faceValue) return '<span class="empty-note">—</span>';
        return `<a class="value-link" href="${productUrl}" target="_blank" rel="noreferrer">${voucher.faceValue}</a>`;
      }

      function renderStoreRows(store) {
        const slug = store.slug;
        const productUrl = store.productUrl || store.url;
        const rank = store.listingRank ? `<span class="store-rank">#${store.listingRank}</span>` : '';
        const vouchers = store.vouchers ?? [];
        const top = vouchers[0];
        const rest = vouchers.slice(1);
        const canExpand = rest.length > 0;
        const cashback =
          top?.cashback ??
          (store.earnUptoCashback
            ? `<span title="${store.earnUptoText ?? ''}">${store.earnUptoCashback}</span>`
            : '<span class="empty-note">—</span>');

        let html = `<tr class="store-row" data-store="${slug}">
          <td class="store-name">${rank}<a href="${store.url}" target="_blank" rel="noreferrer">${store.name}</a></td>
          <td>${renderVoucherCell(top, productUrl)}</td>
          <td>${cashback}</td>
          <td class="expand-col">
            <button class="expand-btn" type="button" data-store="${slug}" aria-label="Expand vouchers" ${canExpand ? '' : 'disabled'}>${canExpand ? '▶' : '·'}</button>
          </td>
        </tr>`;

        for (const v of rest) {
          html += `<tr class="detail-row" data-store="${slug}" data-detail="1">
            <td></td>
            <td>${renderVoucherCell(v, productUrl)}</td>
            <td>${v.cashback ?? '—'}</td>
            <td class="expand-col"></td>
          </tr>`;
        }
        return html;
      }

      function renderDeals() {
        if (!zingoyData) {
          dealsPanel.innerHTML = '<p class="empty-note">Gift card data not loaded.</p>';
          return;
        }
        const rows = zingoyData.stores.map(renderStoreRows).join('');
        dealsPanel.innerHTML = `<div class="panel">
          <table>
            <thead>
              <tr>
                <th>Store</th>
                <th>Value</th>
                <th>Cashback</th>
                <th class="expand-col"></th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }

      function renderMarkets() {
        if (!marketsData) {
          marketsPanel.innerHTML = '<p class="empty-note">Markets data not loaded. Run <code>npm run fetch:markets</code>.</p>';
          return;
        }

        const indexCards = marketsData.indices
          .map((item) => {
            const isFx = item.symbol === 'INR=X';
            const price = isFx ? fmtMoney(item.price, 'INR') : fmtMoney(item.price, 'INR');
            return `<div class="index-card">
              <div class="label">${item.label}</div>
              <div class="price num">${price}</div>
              <div class="change">${fmtChange(item.change, item.changePercent)}</div>
            </div>`;
          })
          .join('');

        const watchRows = marketsData.watchlist
          .map(
            (s) => `<tr>
              <td><strong>${s.label}</strong><br><span class="empty-note">${s.symbol}</span></td>
              <td class="num">${fmtMoney(s.price)}</td>
              <td class="num">${fmtChange(s.change, s.changePercent)}</td>
            </tr>`,
          )
          .join('');

        marketsPanel.innerHTML = `
          <div class="panel">
            <div class="panel-title">Indices &amp; FX</div>
            <div class="index-grid">${indexCards}</div>
          </div>
          <div class="panel">
            <div class="panel-title">Watchlist</div>
            <table>
              <thead>
                <tr>
                  <th>Stock</th>
                  <th>Price</th>
                  <th>Change</th>
                </tr>
              </thead>
              <tbody>${watchRows}</tbody>
            </table>
          </div>`;
      }

      function updateMeta() {
        const parts = [];
        if (zingoyData) {
          parts.push(`${zingoyData.storeCount} gift-card stores · ${new Date(zingoyData.scrapedAt).toLocaleString()}`);
        }
        if (marketsData) {
          parts.push(`Markets · ${new Date(marketsData.scrapedAt).toLocaleString()}`);
        }
        meta.textContent = parts.join(' · ') || 'No data loaded';
      }

      function setTab(tab) {
        activeTab = tab;
        tabs.querySelectorAll('.tab').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        dealsPanel.classList.toggle('hidden', tab !== 'deals');
        marketsPanel.classList.toggle('hidden', tab !== 'markets');
      }

      tabs.addEventListener('click', (event) => {
        const btn = event.target.closest('.tab');
        if (!btn) return;
        setTab(btn.dataset.tab);
      });

      document.body.addEventListener('click', (event) => {
        const btn = event.target.closest('.expand-btn');
        if (!btn || btn.disabled) return;
        const slug = btn.dataset.store;
        const detailRows = dealsPanel.querySelectorAll(`tr.detail-row[data-store="${slug}"]`);
        const isOpen = btn.textContent === '▼';
        detailRows.forEach((row) => row.classList.toggle('open', !isOpen));
        btn.textContent = isOpen ? '▶' : '▼';
      });

      Promise.all([
        fetch('./data/zingoy.json').then((r) => (r.ok ? r.json() : null)),
        fetch('./data/markets.json').then((r) => (r.ok ? r.json() : null)),
      ])
        .then(([zingoy, markets]) => {
          zingoyData = zingoy;
          marketsData = markets;
          renderDeals();
          renderMarkets();
          updateMeta();
          if (!zingoy && !markets) {
            throw new Error('No data files found');
          }
        })
        .catch((err) => {
          meta.textContent = err.message;
          dealsPanel.innerHTML = '<p>Run <code>npm run scrape</code> and <code>npm run fetch:markets</code>.</p>';
        });
    </script>
  </body>
</html>
