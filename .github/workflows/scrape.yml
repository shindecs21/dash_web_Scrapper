name: Scrape Zingoy gift cards

on:
  schedule:
    # Daily 07:00 IST (01:30 UTC)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      limit_stores:
        description: Max stores (default 48)
        required: false
        default: '48'
        type: string
      limit_vouchers:
        description: Vouchers per store
        required: false
        default: '6'
        type: string
      listing_pages:
        description: Listing pages to scan (default 4)
        required: false
        default: '4'
        type: string
      concurrency:
        description: Parallel browser workers
        required: false
        default: '6'
        type: string
  repository_dispatch:
    types: [fetch-latest]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zingoy-scrape
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: |
          node scrapers/zingoy.mjs \
            --limit-stores "${{ github.event.inputs.limit_stores || '48' }}" \
            --limit-vouchers "${{ github.event.inputs.limit_vouchers || '6' }}" \
            --listing-pages "${{ github.event.inputs.listing_pages || '4' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '6' }}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zingoy.json public/data/zingoy.json
          git diff --staged --quiet || git commit -m "chore: update zingoy scrape [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
